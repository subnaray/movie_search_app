<div class="page-shell">
  <header class="topbar">
    <a class="brand" routerLink="/movies">🎬 Movie Search</a>

    <div *ngIf="auth.user$ | async as user" class="user-actions">
      <span>{{ getDisplayName(user.name || user.email) }}</span>
      <button type="button" class="secondary-button" (click)="logout()">Logout</button>
    </div>
  </header>

  <main class="content">
    <section class="hero">
      <h1>Find a movie</h1>
      <p>Search the OMDb catalog.</p>

      <form class="search-form" (ngSubmit)="searchMovies()">
        <input
          type="search"
          name="searchTitle"
          [(ngModel)]="searchTitle"
          placeholder="Try Inception, Interstellar, The Godfather..."
          autocomplete="off"
          aria-label="Movie title"
        />
        <button type="submit" [disabled]="loading">
          {{ loading ? 'Searching…' : 'Search' }}
        </button>
      </form>
    </section>

    <p *ngIf="errorMessage" class="message error">{{ errorMessage }}</p>
    <p *ngIf="loading" class="message">Loading movies…</p>

    <section *ngIf="movies.length > 0" class="movie-grid" aria-label="Movie results">
      <article *ngFor="let movie of movies" class="movie-card">
        <img [src]="posterUrl(movie)" [alt]="movie.Title + ' poster'" />
        <div class="movie-card-body">
          <h2>{{ movie.Title }}</h2>
          <p>{{ movie.Year }} · {{ movie.Type | titlecase }}</p>
          <a class="details-link" [routerLink]="['/movies', movie.imdbID]">View details</a>
        </div>
      </article>
    </section>

    <p *ngIf="hasSearched && !loading && !errorMessage && movies.length === 0" class="message">
      No movies found.
    </p>
  </main>
</div>
